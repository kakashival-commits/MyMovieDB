<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Мій Кінокаталог 4.5</title>
  <style>
    :root {
      --bg: #05070b;
      --surface: rgba(17, 22, 34, 0.85);
      --surface-solid: #111622;
      --surface-hover: rgba(28, 36, 54, 0.92);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --plan: #a855f7;
      --gold: #fbbf24;
      --silver: #e2e8f0;
      --bronze: #d97706;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(ellipse 80% 45% at 50% -10%, rgba(59, 130, 246, 0.14), transparent);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 56px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Global Custom Ultra-Thin Scrollbar (3px) */
    .custom-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.24) transparent;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 3px;
      height: 3px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.24);
      border-radius: 999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
    .custom-scroll::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    /* Header */
    header {
      background: rgba(5, 7, 11, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 16px;
    }
    .header-inner { max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .logo { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: -0.4px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    button:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.28); }
    button.danger:hover { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.5); }

    button.tinder-btn {
      background: linear-gradient(135deg, #f43f5e, #fb7185, #f59e0b);
      border: none;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.38);
      padding: 8px 15px;
    }
    button.tinder-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    button.roulette-btn {
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      border: none;
      color: #fff;
      font-weight: 700;
      display: none;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sync-status { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.loading { background: var(--accent); animation: pulse 1s infinite; }
    .dot.err { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.35; } }

    /* Container & Search */
    .container { max-width: 1240px; margin: 0 auto; padding: 20px 16px; }
    .search-box {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .search-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-row { display: flex; gap: 8px; }
    input, select, textarea {
      background: rgba(5, 7, 11, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .tmdb-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
    .tmdb-item { display: flex; gap: 12px; background: rgba(5, 7, 11, 0.75); border: 1px solid var(--border); border-radius: 12px; padding: 10px; align-items: flex-start; animation: fadeInUp 0.25s ease both; }
    .tmdb-item img { width: 58px; height: 87px; object-fit: cover; border-radius: 8px; background: #090d16; flex-shrink: 0; }
    .tmdb-info { flex: 1; min-width: 0; }
    .tmdb-info h4 { font-size: 0.94rem; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tmdb-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }

    /* Controls */
    .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab.active { background: #f8fafc; border-color: #f8fafc; color: #05070b; font-weight: 700; box-shadow: 0 2px 14px rgba(248, 250, 252, 0.22); }
    .tab.plan { background: rgba(168, 85, 247, 0.12); border-color: rgba(168, 85, 247, 0.4); color: #e9d5ff; }
    .tab.plan.active { background: var(--plan); border-color: var(--plan); color: #fff; box-shadow: 0 2px 14px rgba(168, 85, 247, 0.35); }
    .filter-inputs { display: flex; gap: 8px; flex: 1 1 340px; max-width: 640px; align-items: center; flex-wrap: wrap; }
    .filter-inputs input { flex: 1 1 170px; min-width: 150px; }
    .filter-inputs select { flex: 0 1 175px; min-width: 145px; }

    /* ================= FULL-BLEED OBSIDIAN CATALOG CARDS ================= */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 20px; perspective: 1100px; }
    @media (max-width: 480px) { .catalog-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes foilShimmer {
      0% { transform: translateX(-150%) rotate(25deg); }
      45%, 100% { transform: translateX(230%) rotate(25deg); }
    }

    .card {
      position: relative;
      aspect-ratio: 2 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #0c101a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      animation: fadeInUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform;
      cursor: pointer;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.32);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.8), 0 0 24px rgba(59, 130, 246, 0.16);
      z-index: 3;
    }

    .card-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover .card-poster { transform: scale(1.05); }

    .card-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(5, 7, 11, 0.38) 0%,
        rgba(5, 7, 11, 0) 28%,
        rgba(5, 7, 11, 0.15) 54%,
        rgba(5, 7, 11, 0.86) 80%,
        rgba(5, 7, 11, 0.98) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Rank: GOLD (10/10) */
    .card.rank-gold {
      border: 2px solid #fbbf24;
      box-shadow: 0 10px 30px rgba(251, 191, 36, 0.28), inset 0 0 18px rgba(251, 191, 36, 0.25);
    }
    .card.rank-gold:hover {
      border-color: #fef08a;
      box-shadow: 0 18px 42px rgba(251, 191, 36, 0.46), inset 0 0 22px rgba(253, 230, 138, 0.3);
    }
    .card.rank-gold::after {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 55%; height: 200%;
      background: linear-gradient(90deg, transparent, rgba(254, 240, 138, 0.28), transparent);
      animation: foilShimmer 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 4;
    }

    /* Rank: SILVER (9/10) */
    .card.rank-silver {
      border: 2px solid #e2e8f0;
      box-shadow: 0 10px 26px rgba(226, 232, 240, 0.22), inset 0 0 14px rgba(248, 250, 252, 0.2);
    }
    .card.rank-silver:hover {
      border-color: #ffffff;
      box-shadow: 0 18px 38px rgba(226, 232, 240, 0.36), inset 0 0 18px rgba(255, 255, 255, 0.25);
    }

    /* Rank: BRONZE (8/10) */
    .card.rank-bronze {
      border: 2px solid #d97706;
      box-shadow: 0 10px 24px rgba(217, 119, 6, 0.22), inset 0 0 14px rgba(245, 158, 11, 0.18);
    }
    .card.rank-bronze:hover {
      border-color: #fbbf24;
      box-shadow: 0 18px 36px rgba(217, 119, 6, 0.34), inset 0 0 18px rgba(251, 191, 36, 0.22);
    }

    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.22), transparent 65%);
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
      mix-blend-mode: overlay;
    }
    .card:hover .card-glare { opacity: 1; }

    .badge-type {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(5, 7, 11, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(248, 250, 252, 0.9);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      z-index: 6;
    }

    .badge-rating {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(5, 7, 11, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 3px 9px;
      border-radius: 999px;
      z-index: 8;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-rating:hover { transform: scale(1.1); background: rgba(30, 41, 59, 0.92); }
    .badge-rating.gold {
      background: linear-gradient(135deg, rgba(69, 26, 3, 0.88), rgba(146, 64, 14, 0.88));
      border-color: #fbbf24;
      color: #fef08a;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.55);
    }
    .badge-rating.silver {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(71, 85, 105, 0.88));
      border-color: #f8fafc;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(248, 250, 252, 0.4);
    }
    .badge-rating.bronze {
      background: linear-gradient(135deg, rgba(67, 20, 7, 0.88), rgba(124, 45, 18, 0.88));
      border-color: #f59e0b;
      color: #fed7aa;
      box-shadow: 0 0 12px rgba(217, 119, 6, 0.4);
    }
    .badge-rating.unrated { color: #cbd5e1; border-color: rgba(255, 255, 255, 0.18); }

    .badge-plan {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(88, 28, 135, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(216, 180, 254, 0.45);
      color: #f3e8ff;
      font-weight: 700;
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      z-index: 6;
    }

    .card-overlay-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform 0.22s ease;
    }
    .card:hover .card-overlay-info, .card.actions-open .card-overlay-info {
      transform: translateY(-38px);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: rgba(226, 232, 240, 0.8);
      margin-top: 3px;
    }
    .card-note-pill {
      font-size: 0.72rem;
      color: #fde68a;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 2px 7px;
      border-radius: 6px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-glass-dock {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      padding: 4px;
      border-radius: 11px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      z-index: 9;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover .card-glass-dock, .card.actions-open .card-glass-dock {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .dock-btn {
      flex: 1;
      padding: 5px 0;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 7px;
      color: #f8fafc;
      font-size: 0.78rem;
    }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .dock-btn.del:hover { background: rgba(239, 68, 68, 0.28); color: #fca5a5; }

    /* Quick Inline Rating Popover */
    .quick-rate-popover {
      position: fixed;
      z-index: 120;
      background: rgba(11, 15, 25, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      display: none;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      width: 238px;
      animation: fadeInUp 0.14s ease both;
    }
    .quick-rate-popover.open { display: grid; }
    .qr-btn {
      padding: 6px 0;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 7px;
      background: rgba(30, 41, 59, 0.8);
    }
    .qr-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .qr-btn.r-10 { border-color: rgba(251, 191, 36, 0.65); color: #fde68a; }
    .qr-btn.r-9 { border-color: rgba(226, 232, 240, 0.5); color: #f8fafc; }
    .qr-btn.r-8 { border-color: rgba(217, 119, 6, 0.5); color: #fed7aa; }

    /* Modals */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; backdrop-filter: blur(6px); }
    .modal-backdrop.open { display: flex; }
    .modal { background: #111622; border: 1px solid var(--border-strong); border-radius: 18px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75); }
    .modal-handle { display: none; }

    @media (max-width: 480px) {
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal { border-radius: 22px 22px 0 0; max-height: 88vh; padding-bottom: 36px; animation: slideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1); border-bottom: none; }
      .modal-handle { display: block; width: 42px; height: 5px; background: #475569; border-radius: 5px; margin: 0 auto 14px auto; }
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal h3 { margin-bottom: 14px; font-size: 1.15rem; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.84rem; color: var(--text-muted); margin-bottom: 5px; }
    .rating-selector { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .rate-btn { padding: 8px 0; justify-content: center; font-weight: 700; font-size: 0.85rem; }
    .rate-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 12px rgba(245, 158, 11, 0.45); transform: scale(1.06); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); }

    .toast { position: fixed; bottom: 20px; right: 20px; background: #161d2e; border: 1px solid var(--primary); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65); transform: translateY(100px); opacity: 0; transition: all 0.25s ease; z-index: 2000; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ================= HORIZONTAL CASE-STYLE ROULETTE ================= */
    .roulette-viewport {
      position: relative;
      width: 100%;
      height: 224px;
      background: #05070b;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin: 12px 0 14px 0;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
    }
    .roulette-viewport::before, .roulette-viewport::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 55px;
      z-index: 4;
      pointer-events: none;
    }
    .roulette-viewport::before { left: 0; background: linear-gradient(to right, #05070b, transparent); }
    .roulette-viewport::after { right: 0; background: linear-gradient(to left, #05070b, transparent); }

    .roulette-needle {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 3px;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent), 0 0 4px #fff;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
    }
    .roulette-needle::before, .roulette-needle::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
    }
    .roulette-needle::before { top: 0; border-top: 10px solid var(--accent); }
    .roulette-needle::after { bottom: 0; border-bottom: 10px solid var(--accent); }

    .roulette-track { display: flex; gap: 12px; padding-left: 50%; will-change: transform; }
    .roulette-slot {
      width: 126px;
      height: 190px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 2px solid #1e293b;
      background: #111827;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .roulette-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .roulette-slot .slot-title {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 18px 6px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .roulette-slot.winner {
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.75);
      transform: scale(1.06);
      z-index: 3;
    }

    #rouletteResultBox {
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* ================= TINDER 4.5 FANNED DECK OVERLAY ================= */
    .tinder-overlay { position: fixed; inset: 0; background: #05070b; z-index: 999; display: none; flex-direction: column; overflow: hidden; }

    .tinder-ambilight {
      position: absolute;
      inset: -50px;
      background-size: cover;
      background-position: center;
      filter: blur(65px) saturate(1.85) brightness(0.45);
      transition: background-image 0.55s ease;
      z-index: 1;
      pointer-events: none;
    }

    .tinder-header {
      position: relative;
      z-index: 10;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(5, 7, 11, 0.62);
      backdrop-filter: blur(14px);
      flex-wrap: wrap;
      transition: opacity 0.2s ease;
    }

    .tinder-modes { display: flex; gap: 5px; background: rgba(15, 23, 42, 0.8); padding: 4px; border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .tmode-btn { padding: 5px 10px; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; }
    .tmode-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4); }

    .tinder-header-right { display: flex; align-items: center; gap: 8px; }
    .tinder-decade-select { width: auto; padding: 5px 9px; font-size: 0.8rem; background: rgba(15, 23, 42, 0.85); border-color: rgba(255, 255, 255, 0.15); border-radius: 9px; }
    .session-badge { font-size: 0.78rem; color: #cbd5e1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); padding: 5px 10px; border-radius: 9px; font-weight: 600; white-space: nowrap; }

    .tinder-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 5; padding: 10px 16px; }
    .tinder-area.elevated { z-index: 25; }

    /* Fanned Deck Container */
    .tinder-stack {
      position: relative;
      width: 282px;
      height: 422px;
      perspective: 1400px;
      touch-action: none;
      margin-right: 26px;
    }
    .tinder-stack.is-flipped {
      touch-action: pan-y;
    }
    @media (max-height: 750px) {
      .tinder-stack { width: 230px; height: 344px; margin-right: 20px; }
    }

    .tinder-card {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transform-origin: 50% 88%;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
      will-change: transform;
      border-radius: 18px;
    }

    .tinder-card.top-card {
      z-index: 3;
      cursor: grab;
      transform: translate3d(0px, 0px, 0px) rotate(-2.5deg) scale(1);
    }
    .tinder-card.top-card:active { cursor: grabbing; }

    .tinder-card.second-card {
      z-index: 2;
      transform: translate3d(34px, 8px, -10px) rotate(4.5deg) scale(0.94);
      pointer-events: none;
    }

    .tinder-card.third-card {
      z-index: 1;
      transform: translate3d(64px, 18px, -20px) rotate(10.5deg) scale(0.88);
      pointer-events: none;
    }

    .tinder-card.second-card .tinder-card-front::before,
    .tinder-card.third-card .tinder-card-front::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      pointer-events: none;
      z-index: 4;
      transition: background 0.35s ease;
    }
    .tinder-card.second-card .tinder-card-front::before { background: rgba(5, 7, 11, 0.38); }
    .tinder-card.third-card .tinder-card-front::before { background: rgba(5, 7, 11, 0.62); }

    @media (max-width: 420px) {
      .tinder-card.second-card { transform: translate3d(26px, 7px, -10px) rotate(4deg) scale(0.94); }
      .tinder-card.third-card { transform: translate3d(48px, 15px, -20px) rotate(9deg) scale(0.88); }
    }

    .tinder-card.flipped {
      transform: translate3d(0px, 0px, 0px) rotateY(180deg) rotateZ(0deg) !important;
      cursor: default;
    }
    .tinder-card.flipped .tinder-card-front {
      pointer-events: none;
    }
    .tinder-card.moving { transition: none !important; }

    .tinder-card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      overflow: hidden;
      background: #111622;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      display: flex;
      flex-direction: column;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .tinder-card.glow-right .tinder-card-face { border-color: var(--success); box-shadow: 0 0 32px rgba(16, 185, 129, 0.6); }
    .tinder-card.glow-left .tinder-card-face { border-color: var(--danger); box-shadow: 0 0 32px rgba(239, 68, 68, 0.6); }
    .tinder-card.glow-up .tinder-card-face { border-color: var(--plan); box-shadow: 0 0 36px rgba(168, 85, 247, 0.75), inset 0 0 20px rgba(168, 85, 247, 0.25); }

    .tinder-card.glow-down .tinder-card-face {
      border: 3px solid #fbbf24;
      box-shadow: 0 0 44px rgba(251, 191, 36, 0.88), inset 0 0 24px rgba(251, 191, 36, 0.35);
    }
    .tinder-card.glow-down .tinder-card-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.26), transparent 55%, rgba(253, 230, 138, 0.32));
      pointer-events: none;
      z-index: 6;
    }

    .tinder-card-front { z-index: 2; transform: rotateY(0deg); }
    .tinder-card-front img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Adaptive Stamp Positioning */
    .card-stamp {
      position: absolute;
      top: 18px;
      left: 14px;
      padding: 6px 13px;
      border: 2.5px solid;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.96rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0;
      transform: rotate(-10deg) scale(0.82);
      transition: opacity 0.14s ease, transform 0.14s ease;
      background: rgba(5, 7, 11, 0.88);
      backdrop-filter: blur(8px);
      pointer-events: none;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .card-stamp.visible { opacity: 1; transform: rotate(-7deg) scale(1); }

    .card-stamp.bottom-stamp {
      top: auto;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) scale(0.84);
      background: rgba(24, 12, 42, 0.92);
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.45);
    }
    .card-stamp.bottom-stamp.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .card-stamp.gold-stamp {
      background: linear-gradient(135deg, rgba(41, 26, 5, 0.95), rgba(85, 48, 8, 0.95));
      border-color: #fbbf24;
      color: #fde68a;
      box-shadow: 0 8px 25px rgba(251, 191, 36, 0.45);
    }

    /* Info Caption & Progress Bars Below Fanned Deck */
    .tinder-caption-area {
      margin-top: 22px;
      text-align: center;
      z-index: 10;
      max-width: 340px;
      padding: 0 12px;
      transition: opacity 0.2s ease;
    }
    @media (max-height: 750px) { .tinder-caption-area { margin-top: 16px; } }

    .tinder-tag-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 4px;
    }
    .tinder-movie-title {
      font-size: 1.42rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tinder-movie-sub {
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-top: 4px;
      font-weight: 500;
    }

    .tinder-progress-bars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .t-bar {
      width: 24px;
      height: 3.5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.25s ease, width 0.25s ease, box-shadow 0.25s ease;
    }
    .t-bar.active {
      width: 34px;
      background: #818cf8;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.8);
    }

    /* ================= BACK FACE ARCHITECTURE + FRANCHISE STRIP ================= */
    .tinder-card-back {
      z-index: 1;
      transform: rotateY(180deg);
      padding: 15px 15px 12px 15px;
      overflow: hidden;
      background: linear-gradient(180deg, #131929 0%, #090d16 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .tinder-card.flipped .tinder-card-back { z-index: 5; }

    .back-header {
      flex-shrink: 0;
    }
    .tinder-card-back h3 {
      margin-bottom: 6px;
      color: #f8fafc;
      font-size: 1.08rem;
      padding-right: 42px;
      line-height: 1.24;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .back-meta-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .meta-chip {
      font-size: 0.71rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 7px;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(96, 165, 250, 0.28);
      color: #93c5fd;
    }
    .meta-chip.country {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(251, 191, 36, 0.28);
      color: #fde68a;
    }

    .overview-scroll-wrap {
      position: relative;
      flex: 1;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
    }
    .overview-scroll-wrap::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 4px;
      height: 18px;
      background: linear-gradient(to bottom, rgba(10, 14, 24, 0), #0b101b);
      pointer-events: none;
    }

    .tinder-card-back .overview {
      flex: 1;
      overflow-y: auto;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      user-select: none;
      cursor: grab;
      padding-right: 6px;
      padding-bottom: 14px;
      font-size: 0.85rem;
      line-height: 1.48;
      color: #cbd5e1;
    }
    .tinder-card-back .overview.grabbing {
      cursor: grabbing;
    }

    /* Franchise / Sequels & Prequels Block */
    .franchise-box {
      flex-shrink: 0;
      margin-bottom: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .franchise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 6px;
    }
    .franchise-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
    }
    .f-part {
      position: relative;
      width: 52px;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .f-part:hover { transform: translateY(-2px); }
    .f-poster-wrap {
      position: relative;
      width: 52px;
      height: 76px;
      border-radius: 7px;
      overflow: hidden;
      background: #05070b;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
    }
    .f-part.is-current .f-poster-wrap {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.55);
    }
    .f-part.is-watched .f-poster-wrap {
      border-color: rgba(16, 185, 129, 0.65);
    }
    .f-part.is-plan .f-poster-wrap {
      border-color: rgba(168, 85, 247, 0.75);
    }
    .f-poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .f-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(5, 7, 11, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      line-height: 1.15;
    }
    .f-badge.cur { background: var(--primary); border-color: var(--primary); }
    .f-badge.ok { background: rgba(6, 78, 59, 0.92); border-color: var(--success); color: #6ee7b7; }
    .f-badge.plan { background: rgba(88, 28, 135, 0.92); border-color: var(--plan); color: #e9d5ff; }
    .f-badge.add { background: rgba(15, 23, 42, 0.85); color: #cbd5e1; }

    .f-year {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .f-part.is-current .f-year { color: #93c5fd; font-weight: 700; }

    .tinder-card-back .back-footer {
      flex-shrink: 0;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .tinder-card-back .rating { color: var(--accent); }
    .tinder-card-back .runtime { color: var(--text-muted); font-weight: 600; }

    .tinder-flip-btn {
      position: absolute;
      top: 11px;
      right: 11px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(5, 7, 11, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .tinder-flip-btn:hover { background: rgba(30, 41, 59, 0.95); transform: scale(1.08); }

    .tinder-card-back .tinder-flip-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.38);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    .tinder-card-back .tinder-flip-btn:hover {
      background: rgba(255, 255, 255, 0.24);
      border-color: rgba(255, 255, 255, 0.65);
      transform: scale(1.08);
    }

    .tinder-controls { display: flex; gap: 13px; margin-top: 20px; z-index: 10; justify-content: center; align-items: center; }
    .tinder-btn-circle { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid; background: rgba(11, 15, 25, 0.88); backdrop-filter: blur(8px); transition: transform 0.12s ease, box-shadow 0.15s ease; }
    .tinder-btn-circle.small { width: 42px; height: 42px; }
    @media (max-height: 750px) {
      .tinder-btn-circle { width: 46px; height: 46px; }
      .tinder-btn-circle.small { width: 38px; height: 38px; }
      .tinder-controls { margin-top: 14px; gap: 10px; }
    }
    .tinder-btn-circle:hover:not(:disabled) { transform: translateY(-3px) scale(1.06); }
    .tinder-btn-circle:active:not(:disabled) { transform: scale(0.9); }
    .tinder-btn-undo { border-color: #64748b; color: #cbd5e1; }
    .tinder-btn-skip { border-color: var(--danger); color: var(--danger); box-shadow: 0 6px 18px rgba(239, 68, 68, 0.25); }
    .tinder-btn-super { border-color: #fbbf24; color: #fbbf24; box-shadow: 0 6px 20px rgba(251, 191, 36, 0.35); background: linear-gradient(145deg, rgba(41, 26, 5, 0.95), rgba(11, 15, 25, 0.95)); }
    .tinder-btn-plan { border-color: var(--plan); color: var(--plan); box-shadow: 0 6px 18px rgba(168, 85, 247, 0.25); }
    .tinder-btn-seen { border-color: var(--success); color: var(--success); box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25); }

    .tinder-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; color: var(--text-muted); }

    #fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1500; }
  </style>
</head>
<body>

<canvas id="fxCanvas"></canvas>
<div class="quick-rate-popover" id="quickRatePopover"></div>

<header>
  <div class="header-inner">
    <div class="logo">🎬 Мій Кінокаталог</div>
    <div class="header-actions">
      <div class="sync-status" id="syncStatus">
        <span class="dot" id="syncDot"></span><span id="syncText">Локально</span>
      </div>
      <button id="soundToggleBtn" onclick="toggleSound()" title="Звукові ефекти">🔊</button>
      <button onclick="syncFromGist()" title="Оновити з GitHub Gist">🔄</button>
      <button onclick="openSettings()">⚙️ Налаштування</button>
    </div>
  </div>
</header>

<div class="container" id="mainContainer">
  <!-- Пошук в TMDb -->
  <div class="search-box">
    <div class="search-title">
      <span>Додати переглянуте з бази TMDb</span>
      <button class="tinder-btn" onclick="openTinderMode()">🔥 Tinder-режим</button>
    </div>
    <form class="search-row" onsubmit="searchTMDb(event)">
      <input type="text" id="tmdbQuery" placeholder="Введіть назву фільму, серіалу чи документалки..." required />
      <button type="submit" class="primary">🔍 Знайти</button>
    </form>
    <div class="tmdb-results" id="tmdbResults"></div>
  </div>

  <!-- Фільтри та пошук у власному списку -->
  <div class="controls-bar">
    <div class="tabs" id="categoryTabs">
      <button class="tab active" data-cat="all" onclick="setCategory('all')">Переглянуті (<span id="cnt-all">0</span>)</button>
      <button class="tab" data-cat="movie" onclick="setCategory('movie')">Фільми (<span id="cnt-movie">0</span>)</button>
      <button class="tab" data-cat="tv" onclick="setCategory('tv')">Серіали (<span id="cnt-tv">0</span>)</button>
      <button class="tab" data-cat="doc" onclick="setCategory('doc')">Документальні (<span id="cnt-doc">0</span>)</button>
      <button class="tab plan" data-cat="plan" onclick="setCategory('plan')">⬆️ Буду дивитись (<span id="cnt-plan">0</span>)</button>
    </div>

    <div class="filter-inputs">
      <button class="roulette-btn" id="btnRoulette" onclick="openRoulette()">🎲 Що подивитися?</button>
      <input type="text" id="localSearch" placeholder="Пошук у списку..." oninput="renderCatalog()" />
      <select id="sortSelect" onchange="renderCatalog()">
        <option value="added_desc">Новіші зверху</option>
        <option value="rating_desc">Вища оцінка</option>
        <option value="rating_asc">Нижча оцінка</option>
        <option value="year_desc">За роком</option>
        <option value="title_asc">За алфавітом</option>
      </select>
    </div>
  </div>

  <!-- Сітка каталогу -->
  <div class="catalog-grid" id="catalogGrid"></div>
</div>

<!-- TINDER 4.5 FANNED DECK OVERLAY -->
<div class="tinder-overlay" id="tinderOverlay">
  <div class="tinder-ambilight" id="tinderAmbilight"></div>

  <div class="tinder-header">
    <div class="tinder-modes" id="tinderModes">
      <button class="tmode-btn active" data-mode="movie" onclick="switchTinderMode('movie')">🎬 Фільми</button>
      <button class="tmode-btn" data-mode="tv" onclick="switchTinderMode('tv')">📺 Серіали</button>
      <button class="tmode-btn" data-mode="top" onclick="switchTinderMode('top')">🏆 Топ</button>
    </div>

    <div class="tinder-header-right">
      <select class="tinder-decade-select" id="tinderDecade" onchange="changeTinderDecade()">
        <option value="all">Усі роки</option>
        <option value="2020">2020-ті</option>
        <option value="2010">2010-ті</option>
        <option value="2000">2000-ні</option>
        <option value="1990">90-ті</option>
        <option value="1980">80-ті й раніше</option>
      </select>
      <span class="session-badge" id="tinderSessionCount">Сесія: 0</span>
      <button onclick="closeTinderMode()" style="padding:5px 10px;">✕</button>
    </div>
  </div>

  <div class="tinder-area" id="tinderArea">
    <div class="tinder-loading" id="tinderLoading">
      <div style="font-size: 2.2rem; margin-bottom: 10px;">⏳</div>
      <div>Завантаження карток з TMDb...</div>
    </div>

    <div class="tinder-stack" id="tinderStack"></div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'my_cinema_catalog_v1';
  const SKIPPED_KEY = 'my_cinema_skipped_v1';
  const CFG_KEY = 'my_cinema_cfg_v1';
  const GIST_FILENAME = 'my_watched_cinema.json';
  const GIST_SKIPPED_FILENAME = 'my_skipped_cinema.json';
  const NO_POSTER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" fill="%23111622"><rect width="300" height="450"/><text x="50%" y="50%" fill="%2364748b" font-family="sans-serif" font-size="20" text-anchor="middle">Без постера</text></svg>';

  const GENRE_MAP = {
    28: 'Бойовик', 12: 'Пригоди', 16: 'Мультфільм', 35: 'Комедія', 80: 'Кримінал',
    99: 'Документальний', 18: 'Драма', 10751: 'Сімейний', 14: 'Фентезі', 36: 'Історія',
    27: 'Жахи', 10402: 'Музика', 9648: 'Детектив', 10749: 'Мелодрама', 878: 'Фантастика',
    10770: 'Телефільм', 53: 'Трилер', 10752: 'Військовий', 37: 'Вестерн',
    10759: 'Екшн і Пригоди', 10762: 'Дитячий', 10763: 'Новини', 10764: 'Реаліті',
    10765: 'Фантастика та Фентезі', 10766: 'Мильна опера', 10767: 'Ток-шоу', 10768: 'Війна та Політика'
  };

  const REGION_NAMES_UK = typeof Intl !== 'undefined' && Intl.DisplayNames
    ? new Intl.DisplayNames(['uk'], { type: 'region' })
    : null;

  function formatCountry(code) {
    if (!code) return '';
    if (code === 'US') return 'США';
    if (code === 'GB') return 'Велика Британія';
    if (REGION_NAMES_UK) {
      try { return REGION_NAMES_UK.of(code); } catch (e) {}
    }
    return code;
  }

  let catalog = [];
  let skippedIds = new Set();
  let config = { tmdbKey: '', ghToken: '', gistId: '', sound: true };
  let currentCategory = 'all';
  let activeItem = null;
  let selectedRating = null;

  // Tinder 4.5 State
  let tinderMode = 'movie';
  let tinderDecade = 'all';
  let tinderQueue = [];
  let tinderHistory = [];
  let tinderSessionSwiped = 0;
  let tinderPage = 1;
  let currentTinderItem = null;
  let isFetchingTinder = false;
  let topCardEl = null;
  let activeSwipeCleanup = null;
  const tinderDetailsCache = new Map();
  const tinderCollectionCache = new Map();

  // Roulette State
  let isRouletteSpinning = false;

  /* ================= PROCEDURAL WEB AUDIO ENGINE ================= */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSound(type) {
    if (!config.sound) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    if (type === 'tick') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.035);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.04);
    } else if (type === 'swipe') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.14);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.16);
    } else if (type === 'skip') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.14);
    } else if (type === 'super' || type === 'win') {
      const notes = type === 'super' ? [523.25, 659.25, 783.99, 1046.5] : [440, 554.37, 659.25, 880];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.065);
        gain.gain.setValueAtTime(0.11, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.38);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.4);
      });
    }
  }

  function toggleSound() {
    config.sound = !config.sound;
    localStorage.setItem(CFG_KEY, JSON.stringify(config));
    updateSoundIcon();
    if (config.sound) playSound('tick');
    showToast(config.sound ? 'Звук увімкнено 🔊' : 'Звук вимкнено 🔇');
  }

  function updateSoundIcon() {
    document.getElementById('soundToggleBtn').textContent = config.sound ? '🔊' : '🔇';
  }

  function vibe(pattern) {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  }

  /* ================= PREMIUM GOLDEN BOKEH & CONFETTI PARTICLE ENGINE ================= */
  const fxCanvas = document.getElementById('fxCanvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];
  let fxAnimRunning = false;

  function resizeFxCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFxCanvas);
  resizeFxCanvas();

  function spawnParticles(mode = 'confetti', originX = window.innerWidth / 2, originY = window.innerHeight / 2) {
    if (mode === 'goldDust') {
      const goldPalette = ['#fef08a', '#fbbf24', '#f59e0b', '#fde68a', '#ffffff'];
      for (let i = 0; i < 68; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 6.5;
        particles.push({
          type: 'bokeh',
          x: originX + (Math.random() - 0.5) * 180,
          y: originY + (Math.random() - 0.5) * 240,
          vx: Math.cos(angle) * speed * 0.7,
          vy: Math.sin(angle) * speed * 0.7 - (1.2 + Math.random() * 2.2),
          radius: 2 + Math.random() * 6.5,
          color: goldPalette[Math.floor(Math.random() * goldPalette.length)],
          alpha: 0.95,
          decay: 0.012 + Math.random() * 0.01,
          twinkle: Math.random() * Math.PI * 2
        });
      }
    } else {
      const colors = ['#f59e0b', '#3b82f6', '#10b981', '#fbbf24', '#a855f7'];
      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 10;
        particles.push({
          type: 'confetti',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12
        });
      }
    }
    if (!fxAnimRunning) renderParticles();
  }

  function renderParticles() {
    fxAnimRunning = true;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.type === 'bokeh') {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.twinkle += 0.14;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const pulseAlpha = Math.max(0, p.alpha * (0.65 + 0.35 * Math.sin(p.twinkle)));
        fxCtx.save();
        fxCtx.globalCompositeOperation = 'lighter';
        const grad = fxCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 2.2);
        grad.addColorStop(0, `rgba(254, 240, 138, ${pulseAlpha})`);
        grad.addColorStop(0.45, `rgba(251, 191, 36, ${pulseAlpha * 0.7})`);
        grad.addColorStop(1, 'rgba(245, 158, 11, 0)');
        fxCtx.fillStyle = grad;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.radius * 2.2, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      } else {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28;
        p.vx *= 0.98;
        p.rot += p.vRot;
        p.alpha -= 0.016;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        fxCtx.save();
        fxCtx.globalAlpha = p.alpha;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate((p.rot * Math.PI) / 180);
        fxCtx.fillStyle = p.color;
        fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        fxCtx.restore();
      }
    }

    if (particles.length > 0) {
      requestAnimationFrame(renderParticles);
    } else {
      fxAnimRunning = false;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    }
  }

  /* ================= INITIALIZATION ================= */
  window.addEventListener('DOMContentLoaded', async () => {
    loadConfig();
    updateSoundIcon();
    loadLocalCatalog();
    loadSkippedIds();
    buildRatingButtons();
    renderCatalog();

    if (config.ghToken && config.gistId) {
      await syncFromGist(true);
    } else if (!config.tmdbKey) {
      showToast('Вкажіть TMDb API Key у Налаштуваннях ⚙️');
    }
  });

  function loadConfig() {
    try {
      const s = JSON.parse(localStorage.getItem(CFG_KEY));
      if (s) config = { ...config, ...s };
    } catch (e) {}
  }
  function loadLocalCatalog() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(s)) catalog = s;
    } catch (e) {}
  }
  function saveLocalCatalog() { localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog)); }

  function loadSkippedIds() {
    try {
      const s = JSON.parse(localStorage.getItem(SKIPPED_KEY));
      if (Array.isArray(s)) skippedIds = new Set(s);
    } catch (e) {}
  }
  function saveSkippedIds() {
    localStorage.setItem(SKIPPED_KEY, JSON.stringify(Array.from(skippedIds)));
  }

  function clearSkippedList() {
    if (skippedIds.size === 0) return showToast('Список пропущених уже порожній');
    if (!confirm(`Повернути всі ${skippedIds.size} пропущених карток назад у Tinder-потік?`)) return;
    skippedIds.clear();
    saveSkippedIds();
    tinderPage = 1;
    tinderQueue = [];
    document.getElementById('skippedCountLabel').textContent = '0';
    vibe([15, 25]);
    playSound('tick');
    showToast('Список пропущених очищено');
    backgroundGistSync();
  }

  function getCardRankInfo(item) {
    if (item.status === 'plan') return { cardClass: '', badgeClass: '', icon: '' };
    const r = Number(item.rating);
    const isFavNote = item.note && (item.note.includes('Улюблене') || item.note.includes('Шедевр'));
    if (r === 10 || isFavNote) return { cardClass: 'rank-gold', badgeClass: 'gold', icon: '🏆' };
    if (r === 9) return { cardClass: 'rank-silver', badgeClass: 'silver', icon: '🥈' };
    if (r === 8) return { cardClass: 'rank-bronze', badgeClass: 'bronze', icon: '🥉' };
    return { cardClass: '', badgeClass: '', icon: '★' };
  }

  function buildRatingButtons() {
    const wrap = document.getElementById('ratingSelector');
    wrap.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rate-btn' + (i === selectedRating ? ' selected' : '');
      btn.textContent = i;
      btn.onclick = () => {
        vibe(10);
        playSound('tick');
        selectedRating = i;
        document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
      wrap.appendChild(btn);
    }
  }

  function setUnrated() {
    selectedRating = null;
    document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('selected'));
  }

  function toggleRatingVisibility() {
    document.getElementById('ratingGroup').style.display = (document.getElementById('itemStatus').value === 'plan') ? 'none' : 'block';
  }

  /* ================= QUICK INLINE RATING POPOVER ================= */
  const quickPopover = document.getElementById('quickRatePopover');

  function openQuickRate(e, itemId) {
    e.stopPropagation();
    const item = catalog.find(c => c.id === itemId);
    if (!item) return;

    quickPopover.innerHTML = '';

    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      const tierClass = i === 10 ? ' r-10' : i === 9 ? ' r-9' : i === 8 ? ' r-8' : '';
      btn.className = 'qr-btn' + tierClass + (item.rating === i ? ' active' : '');
      btn.textContent = i;
      btn.onclick = (ev) => {
        ev.stopPropagation();
        applyQuickRating(itemId, i);
      };
      quickPopover.appendChild(btn);
    }

    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';

      const url = `https://api.themoviedb.org/3/search/multi?api_key=${config.tmdbKey}&language=uk-UA&query=${encodeURIComponent(query)}&include_adult=false`;
      const res = await fetch(url);
      const data = await res.json();
      const items = (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv').slice(0, 8);

      if (!items.length) { resultsEl.innerHTML = '<div>Нічого не знайдено.</div>'; return; }

        const title = isTv ? item.name : item.title;
        const year = (isTv ? item.first_air_date : item.release_date)?.slice(0, 4) || '—';
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : NO_POSTER;
        const id = `${item.media_type}_${item.id}`;

          <div class="tmdb-info">

            <div class="tmdb-meta">${year} • ${isDoc ? 'Документальний' : isTv ? 'Серіал' : 'Фільм'}</div>

          </div>
        `;
        div.querySelector('button').onclick = () => {
          vibe(10);
          openItemModal({
            id, tmdbId: item.id, title, year, poster,
            category: existing ? existing.category : (isDoc ? 'doc' : isTv ? 'tv' : 'movie'),
            status: existing ? (existing.status || 'watched') : 'watched',
            rating: existing ? existing.rating : null,
            watchedDate: existing ? existing.watchedDate : new Date().toISOString().slice(0, 10),

  /* ================= HORIZONTAL CASE-STYLE ROULETTE ================= */
  function buildNoAdjacentDuplicatesList(plans, length) {
    const result = [];
    let lastId = null;
    for (let i = 0; i < length; i++) {
      let pool = plans.filter(p => p.id !== lastId);
      if (pool.length === 0) pool = plans;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      result.push(chosen);
      lastId = chosen.id;
    }
    return result;
  }

  function openRoulette() {
    const plans = catalog.filter(c => c.status === 'plan');

    document.getElementById('spinBtn').disabled = false;
    document.getElementById('spinBtn').textContent = '🎰 Крутити стрічку!';

    const track = document.getElementById('rouletteTrack');
    track.style.transition = 'none';
    track.style.transform = 'translateX(-477px)';
    track.innerHTML = '';

    const previewItems = buildNoAdjacentDuplicatesList(plans, 14);
    previewItems.forEach(p => track.appendChild(createRouletteSlot(p)));

    document.getElementById('rouletteModal').classList.add('open');
  }

  function createRouletteSlot(item) {
    const div = document.createElement('div');
    div.className = 'roulette-slot';
    div.innerHTML = `
      <img src="${item.poster || NO_POSTER}" alt="" />
      <div class="slot-title">${escapeHtml(item.title)}</div>
    `;
    return div;
  }

  function spinRoulette() {
    if (isRouletteSpinning) return;
    const plans = catalog.filter(c => c.status === 'plan');
    if (plans.length < 2) return;

    isRouletteSpinning = true;
    const spinBtn = document.getElementById('spinBtn');
    spinBtn.disabled = true;
    spinBtn.textContent = 'Крутиться...';
    document.getElementById('rouletteResultBox').innerHTML = `<span style="color:var(--text-muted); font-size:0.88rem;">Обираємо фільм на вечір...</span>`;

    const track = document.getElementById('rouletteTrack');
    track.style.transition = 'none';
    track.style.transform = 'translateX(-477px)';
    track.innerHTML = '';

    const totalSlots = 48;
    const winnerIndex = 39;
    const itemsList = buildNoAdjacentDuplicatesList(plans, totalSlots);
    const winnerItem = itemsList[winnerIndex];

    const slotElements = [];
    itemsList.forEach(item => {
      const el = createRouletteSlot(item);
      track.appendChild(el);
      slotElements.push(el);
    });

    const slotStep = 138;
    const randomOffset = Math.floor((Math.random() - 0.5) * 56);
    const targetTranslate = -(winnerIndex * slotStep + 63 + randomOffset);

    let lastPassedSlot = -1;
    const startTime = performance.now();
    const duration = 4200;

    function trackTicks(now) {
      if (!isRouletteSpinning) return;
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3.6);
      const currentPos = Math.abs(-477 + (targetTranslate + 477) * eased);
      const currentSlot = Math.floor(currentPos / slotStep);

      if (currentSlot !== lastPassedSlot) {
        lastPassedSlot = currentSlot;
        playSound('tick');
        vibe(8);
      }
      if (progress < 1) requestAnimationFrame(trackTicks);
    }

    requestAnimationFrame(() => {
      track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
      track.style.transform = `translateX(${targetTranslate}px)`;
      requestAnimationFrame(trackTicks);
    });

    setTimeout(() => {
      isRouletteSpinning = false;
      slotElements[winnerIndex].classList.add('winner');
      playSound('win');
      vibe([80, 40, 160]);
      spawnParticles('confetti');

      spinBtn.disabled = false;
      spinBtn.textContent = '🔄 Крутити ще раз';

      document.getElementById('rouletteResultBox').innerHTML = `
        <div style="color:var(--accent); font-weight:800; font-size:1.05rem; margin-bottom:8px;">🎉 Сьогодні дивимось: ${escapeHtml(winnerItem.title)} (${winnerItem.year})</div>
        <button class="primary" style="padding:6px 14px; font-size:0.84rem;" onclick="editById('${winnerItem.id}'); closeModal('rouletteModal');">✅ Відмітити як переглянуто</button>
      `;
    }, duration + 80);
  }

  function getDecadeQueryParams(isTv) {
    const today = new Date().toISOString().slice(0, 10);
    const field = isTv ? 'first_air_date' : 'primary_release_date';
    if (tinderDecade === '2020') return `&${field}.gte=2020-01-01&${field}.lte=${today}`;
    if (tinderDecade === '2010') return `&${field}.gte=2010-01-01&${field}.lte=2019-12-31`;
    if (tinderDecade === '2000') return `&${field}.gte=2000-01-01&${field}.lte=2009-12-31`;
    if (tinderDecade === '1990') return `&${field}.gte=1990-01-01&${field}.lte=1999-12-31`;
    if (tinderDecade === '1980') return `&${field}.lte=1989-12-31`;
    return `&${field}.lte=${today}`;
  }

  async function fetchTinderBatch() {
    if (isFetchingTinder) return;
    isFetchingTinder = true;
    if (tinderQueue.length === 0) document.getElementById('tinderLoading').style.display = 'flex';

    let pagesChecked = 0;
    const maxPagesToScan = 15;

    try {
      while (tinderQueue.length < 12 && pagesChecked < maxPagesToScan) {
        pagesChecked++;
        let url = '';
        let mediaType = 'movie';

        if (tinderMode === 'movie') {
          const dateFilter = getDecadeQueryParams(false);
          url = `https://api.themoviedb.org/3/discover/movie?api_key=${config.tmdbKey}&language=uk-UA&sort_by=popularity.desc&vote_count.gte=500${dateFilter}&page=${tinderPage}`;
          mediaType = 'movie';
        } else if (tinderMode === 'tv') {
          const dateFilter = getDecadeQueryParams(true);
          url = `https://api.themoviedb.org/3/discover/tv?api_key=${config.tmdbKey}&language=uk-UA&sort_by=popularity.desc&vote_count.gte=300${dateFilter}&page=${tinderPage}`;
          mediaType = 'tv';
        } else {
          const dateFilter = getDecadeQueryParams(false);
          url = `https://api.themoviedb.org/3/discover/movie?api_key=${config.tmdbKey}&language=uk-UA&sort_by=vote_average.desc&vote_count.gte=2500${dateFilter}&page=${tinderPage}`;
          mediaType = 'movie';
        }

        const res = await fetch(url);
        const data = await res.json();
        const totalPages = Math.min(data.total_pages || 30, 40);

        (data.results || []).forEach(raw => {
          const item = { ...raw, _mediaType: mediaType };
          const id = `${mediaType}_${item.id}`;
          const alreadyInCatalog = catalog.some(c => c.id === id);
          const alreadySkipped = skippedIds.has(id);
          const alreadyInQueue = tinderQueue.some(q => `${q._mediaType}_${q.id}` === id);

          if (!alreadyInCatalog && !alreadySkipped && !alreadyInQueue) {
            if (item.poster_path) {
              const img = new Image();
              img.src = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
            }
            tinderQueue.push(item);
          }
        });

        tinderPage = tinderPage >= totalPages ? 1 : tinderPage + 1;
        if (totalPages <= 1) break;
      }
    } catch (err) {
      console.error(err);
    }

    isFetchingTinder = false;
    document.getElementById('tinderLoading').style.display = 'none';
  }

  function renderTinderStack() {
    if (activeSwipeCleanup) {
      activeSwipeCleanup();
