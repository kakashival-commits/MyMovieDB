<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Мій Кінокаталог 5.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="fxCanvas"></canvas>
<div class="quick-rate-popover" id="quickRatePopover"></div>

<header>
  <div class="header-inner">
    <div class="logo">🎬 Мій Кінокаталог</div>
    <div class="header-actions">
      <div class="sync-status" id="syncStatus">
        <span class="dot" id="syncDot"></span><span id="syncText">Локально</span>
      </div>
      <button id="soundToggleBtn" onclick="toggleSound()" title="Звукові ефекти">🔊</button>
      <button onclick="syncFromGist()" title="Оновити з GitHub Gist">🔄</button>
      <button onclick="openSettings()">⚙️ Налаштування</button>
    </div>
  </div>
</header>

<div class="container" id="mainContainer">
  <!-- Пошук в TMDb -->
  <div class="search-box">
    <div class="search-title">
      <span>Додати переглянуте з бази TMDb</span>
      <button class="tinder-btn" onclick="openTinderMode()">🔥 Tinder-режим</button>
    </div>
    <form class="search-row" onsubmit="searchTMDb(event)">
      <input type="text" id="tmdbQuery" placeholder="Введіть назву фільму, серіалу чи документалки..." required />
      <button type="submit" class="primary">🔍 Знайти</button>
    </form>
    <div class="tmdb-results" id="tmdbResults"></div>
  </div>

  <!-- Фільтри та пошук у власному списку -->
  <div class="controls-bar">
    <div class="tabs" id="categoryTabs">
      <button class="tab active" data-cat="all" onclick="setCategory('all')">Переглянуті (<span id="cnt-all">0</span>)</button>
      <button class="tab fav" data-cat="fav" onclick="setCategory('fav')"><span id="favTabIcon">❤️</span> Улюблені (<span id="cnt-fav">0</span>)</button>
      <button class="tab" data-cat="movie" onclick="setCategory('movie')">Фільми (<span id="cnt-movie">0</span>)</button>
      <button class="tab" data-cat="tv" onclick="setCategory('tv')">Серіали (<span id="cnt-tv">0</span>)</button>
      <button class="tab" data-cat="doc" onclick="setCategory('doc')">Документальні (<span id="cnt-doc">0</span>)</button>
      <button class="tab plan" data-cat="plan" onclick="setCategory('plan')">⬆️ Буду дивитись (<span id="cnt-plan">0</span>)</button>
    </div>

    <div class="filter-inputs">
      <button class="roulette-btn" id="btnRoulette" onclick="openRoulette()">🎲 Що подивитися?</button>
      <input type="text" id="localSearch" placeholder="Пошук у списку..." oninput="renderCatalog()" />
      <select id="sortSelect" onchange="renderCatalog()">
        <option value="added_desc">Новіші зверху</option>
        <option value="rating_desc">Вища оцінка</option>
        <option value="rating_asc">Нижча оцінка</option>
        <option value="year_desc">За роком</option>
        <option value="title_asc">За алфавітом</option>
      </select>
    </div>
  </div>

  <!-- Сітка каталогу -->
  <div class="catalog-grid" id="catalogGrid"></div>
</div>

<!-- TINDER 5.0 FANNED DECK OVERLAY -->
<div class="tinder-overlay" id="tinderOverlay">
  <div class="tinder-ambilight" id="tinderAmbilight"></div>

  <div class="tinder-header">
    <div class="tinder-modes" id="tinderModes">
      <button class="tmode-btn active" data-mode="movie" onclick="switchTinderMode('movie')">🎬 Фільми</button>
      <button class="tmode-btn" data-mode="tv" onclick="switchTinderMode('tv')">📺 Серіали</button>
      <button class="tmode-btn" data-mode="top" onclick="switchTinderMode('top')">🏆 Топ</button>
    </div>

    <div class="tinder-header-right">
      <select class="tinder-decade-select" id="tinderDecade" onchange="changeTinderDecade()">
        <option value="all">Усі роки</option>
        <option value="2020">2020-ті</option>
        <option value="2010">2010-ті</option>
        <option value="2000">2000-ні</option>
        <option value="1990">90-ті</option>
        <option value="1980">80-ті й раніше</option>
      </select>
      <span class="session-badge" id="tinderSessionCount">Сесія: 0</span>
      <button onclick="closeTinderMode()" style="padding:5px 10px;">✕</button>
    </div>
  </div>

  <div class="tinder-area" id="tinderArea">
    <div class="tinder-loading" id="tinderLoading">
      <div style="font-size: 2.2rem; margin-bottom: 10px;">⏳</div>
      <div>Завантаження карток з TMDb...</div>
    </div>

    <div class="tinder-stack" id="tinderStack"></div>

    <div class="tinder-caption-area" id="tinderCaptionArea">
      <div class="tinder-tag-label" id="tinderCaptionTag">ЗАРАЗ У ТРЕНДІ</div>
      <div class="tinder-movie-title" id="tinderCaptionTitle">—</div>
      <div class="tinder-movie-sub" id="tinderCaptionSub">—</div>
      <div class="tinder-progress-bars" id="tinderProgressBars">
        <span class="t-bar active"></span>
        <span class="t-bar"></span>
        <span class="t-bar"></span>
        <span class="t-bar"></span>
        <span class="t-bar"></span>
        <span class="t-bar"></span>
      </div>
    </div>

    <div class="tinder-controls">
      <button class="tinder-btn-circle small tinder-btn-undo" id="btnUndoSwipe" onclick="undoLastSwipe()" title="Повернути попередню картку" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      </button>
      <button class="tinder-btn-circle tinder-btn-skip" onclick="triggerSwipe('left')" title="Не бачив / Більше не показувати">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <button class="tinder-btn-circle tinder-btn-super" onclick="triggerSwipe('down')" title="Платина — 10/10 + Улюблене">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>
      </button>
      <button class="tinder-btn-circle tinder-btn-plan" onclick="triggerSwipe('up')" title="Буду дивитись">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <button class="tinder-btn-circle tinder-btn-seen" onclick="triggerSwipe('right')" title="Вже бачив">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Модальне вікно РУЛЕТКИ -->
<div class="modal-backdrop" id="rouletteModal">
  <div class="modal custom-scroll" style="text-align:center;">
    <div class="modal-handle"></div>
    <h3 style="color:var(--accent); font-size:1.35rem; margin-bottom:4px;">🎲 Рулетка на вечір</h3>
    <div style="font-size:0.85rem; color:var(--text-muted);">Випадковий вибір зі списку «Буду дивитись»</div>

    <div class="roulette-viewport" id="rouletteViewport">
      <div class="roulette-needle"></div>
      <div class="roulette-track" id="rouletteTrack"></div>
    </div>

    <div id="rouletteResultBox">
      <span style="color:var(--text-muted); font-size:0.88rem;">Натисніть кнопку нижче, щоб запустити стрічку</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="primary" id="spinBtn" onclick="spinRoulette()" style="justify-content:center; padding:12px; font-size:1.05rem; background:linear-gradient(135deg, #8b5cf6, #d946ef); border:none; font-weight:700;">🎰 Крутити стрічку!</button>
      <button onclick="closeModal('rouletteModal')" style="justify-content:center;">Закрити</button>
    </div>
  </div>
</div>

<!-- Модальне вікно ДОДАВАННЯ / РЕДАГУВАННЯ -->
<div class="modal-backdrop" id="itemModal">
  <div class="modal custom-scroll">
    <div class="modal-handle"></div>
    <h3 id="modalTitle">Оцінити запис</h3>
    <div style="display:flex; gap:12px; margin-bottom:14px; align-items:center;">
      <img id="modalPoster" src="" alt="" style="width:64px; height:96px; object-fit:cover; border-radius:6px; background:#090d16;" />
      <div style="flex:1; min-width:0;">
        <div id="modalMovieName" style="font-weight:700; font-size:1rem;"></div>
        <div id="modalMovieYear" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:8px;"></div>
        <button type="button" id="modalFavBtn" class="fav-toggle-pill" onclick="toggleModalFavorite()">❤️ Додати в улюблені</button>
      </div>
    </div>

    <div class="form-group">
      <label>Статус</label>
      <select id="itemStatus" onchange="toggleRatingVisibility()">
        <option value="watched">Переглянуто</option>
        <option value="plan">Буду дивитись</option>
      </select>
    </div>

    <div class="form-group">
      <label>Категорія</label>
      <select id="itemCategory">
        <option value="movie">Фільм</option>
        <option value="tv">Серіал</option>
        <option value="doc">Документальний</option>
      </select>
    </div>

    <div class="form-group" id="ratingGroup">
      <label>Оцінка (8 — Бронза, 9 — Срібло, 10 — Золото, 10 + Улюблене — 💎 Платина)</label>
      <div class="rating-selector" id="ratingSelector"></div>
      <div style="margin-top:8px;">
        <button type="button" onclick="setUnrated()" style="padding:4px 8px; font-size:0.75rem;">Залишити без оцінки</button>
      </div>
    </div>

    <div class="form-group">
      <label>Дата додавання/перегляду</label>
      <input type="date" id="itemDate" />
    </div>

    <div class="form-group">
      <label>Особиста нотатка (необов'язково)</label>
      <textarea id="itemNote" rows="3" placeholder="Наприклад: Чудовий дубляж..."></textarea>
    </div>

    <div class="modal-footer">
      <button onclick="closeModal('itemModal')">Скасувати</button>
      <button class="primary" onclick="saveItem()">💾 Зберегти</button>
    </div>
  </div>
</div>

<!-- Модальне вікно НАЛАШТУВАНЬ -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal custom-scroll">
    <div class="modal-handle"></div>
    <h3>⚙️ Налаштування та синхронізація</h3>
    <div class="form-group">
      <label>TMDb API Key (v3 auth)</label>
      <input type="password" id="cfgTmdbKey" placeholder="Вставте ключ API" />
    </div>
    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;" />
    <div class="form-group">
      <label>GitHub Token (права: gist)</label>
      <input type="password" id="cfgGhToken" placeholder="ghp_..." />
    </div>
    <div class="form-group">
      <label>GitHub Gist ID</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="cfgGistId" placeholder="ID (32 символи)" />
        <button type="button" onclick="createNewGist()">+ Створити</button>
      </div>
    </div>
    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;" />
    <div class="form-group">
      <label>Анімація улюблених карток на постері</label>
      <select id="cfgFavEffect">
        <option value="heart">❤️ Живий пульс (подвійний стукіт серця)</option>
        <option value="lightning">⚡ Енергетичний розряд (блискавка по контуру)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tinder-фільтр пропущених («Не бачив»)</label>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; background:rgba(5,7,11,0.85); padding:8px 12px; border-radius:9px; border:1px solid var(--border);">
        <span style="font-size:0.85rem; color:var(--text-muted);">Приховано карток: <strong id="skippedCountLabel" style="color:var(--text);">0</strong></span>
        <button type="button" class="danger" style="padding:5px 10px; font-size:0.8rem;" onclick="clearSkippedList()">Скинути</button>
      </div>
    </div>
    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;" />
    <div class="form-group">
      <label>Резервна копія файлом (JSON)</label>
      <div style="display:flex; gap:8px;">
        <button type="button" onclick="exportJSON()">⬇️ Експорт</button>
        <button type="button" onclick="document.getElementById('importFile').click()">⬆️ Імпорт</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)" />
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('settingsModal')">Закрити</button>
      <button class="primary" onclick="saveSettings()">Зберегти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
