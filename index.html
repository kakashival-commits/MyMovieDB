<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Мій Кінокаталог</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --super: #ec4899;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 40px; overflow-x: hidden; }

    /* Header */
    header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; padding: 12px 16px; }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    button { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { background: var(--surface-hover); }
    button:active { transform: scale(0.97); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
    button.danger:hover { background: rgba(239, 68, 68, 0.15); }
    button.tinder-btn { background: linear-gradient(45deg, #fd297b, #ff655b); border: none; color: white; font-weight: bold; }
    button.roulette-btn { background: linear-gradient(45deg, #8b5cf6, #d946ef); border: none; color: white; font-weight: bold; display: none; }

    .sync-status { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .dot.ok { background: var(--success); }
    .dot.loading { background: var(--accent); animation: pulse 1s infinite; }
    .dot.err { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.4; } }

    /* Container & Search */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
    .search-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 24px; }
    .search-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;}
    .search-row { display: flex; gap: 8px; }
    input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; outline: none; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    .tmdb-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
    .tmdb-item { display: flex; gap: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; align-items: flex-start; }
    .tmdb-item img { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; background: #090d16; flex-shrink: 0; }
    .tmdb-info { flex: 1; min-width: 0; }
    .tmdb-info h4 { font-size: 0.95rem; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tmdb-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }

    /* Controls */
    .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; }
    .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .tab.plan { background: rgba(245, 158, 11, 0.1); border-color: var(--accent); color: var(--accent); }
    .tab.plan.active { background: var(--accent); color: #000; }
    .filter-inputs { display: flex; gap: 8px; flex: 1; max-width: 480px; min-width: 260px; align-items: center; }

    /* Catalog */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 16px; }
    @media (max-width: 480px) { .catalog-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s ease; position: relative;}
    .card:hover { transform: translateY(-3px); border-color: #475569; }
    .poster-wrap { position: relative; aspect-ratio: 2 / 3; background: #090d16; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .badge-rating { position: absolute; top: 8px; right: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 0.85rem; padding: 2px 8px; border-radius: 6px; }
    .badge-rating.super { border-color: var(--super); color: var(--super); }
    .badge-plan { position: absolute; top: 8px; right: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid #a855f7; color: #a855f7; font-weight: 700; font-size: 0.8rem; padding: 2px 8px; border-radius: 6px; }
    .badge-type { position: absolute; top: 8px; left: 8px; background: rgba(15, 23, 42, 0.85); color: #e2e8f0; font-size: 0.7rem; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); }
    
    .card-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-year { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
    .card-note { font-size: 0.8rem; color: #cbd5e1; background: rgba(15, 23, 42, 0.5); padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-actions { margin-top: auto; display: flex; gap: 6px; }
    .card-actions button { flex: 1; justify-content: center; padding: 6px; font-size: 0.8rem; }
    
    /* Modals (Adaptive Desktop vs Mobile) */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .modal-handle { display: none; }
    
    @media (max-width: 480px) {
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal { border-radius: 20px 20px 0 0; max-height: 85vh; padding-bottom: 40px; animation: slideUp 0.3s ease-out; border-bottom: none; }
      .modal-handle { display: block; width: 40px; height: 5px; background: var(--border); border-radius: 5px; margin: 0 auto 15px auto; }
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal h3 { margin-bottom: 14px; font-size: 1.15rem; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .rating-selector { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .rate-btn { padding: 8px 0; justify-content: center; font-weight: 700; font-size: 0.85rem; }
    .rate-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); transform: scale(1.05); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .help-text { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
    .empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; border: 1px solid var(--primary); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.25s ease; z-index: 200; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* Roulette Visuals */
    #rouletteDisplay { height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; margin-bottom: 15px;}
    .r-poster { height: 240px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); object-fit: cover; transition: transform 0.1s;}
    .r-title { margin-top: 15px; font-weight: bold; font-size: 1.1rem; text-align: center; padding: 0 10px; }
    .r-winner { animation: popWinner 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; border: 3px solid var(--accent); }
    @keyframes popWinner { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.05); opacity: 1; } }

    /* Tinder Mode Overlay */
    .tinder-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: none; flex-direction: column; }
    .tinder-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .tinder-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    
    .tinder-card-container { position: relative; width: 300px; height: 450px; perspective: 1000px; z-index: 10; touch-action: none; }
    @media (max-height: 700px) { .tinder-card-container { width: 240px; height: 360px; } }
    
    .tinder-card { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.4s ease; cursor: grab; }
    .tinder-card.flipped { transform: rotateY(180deg); }
    .tinder-card.moving { transition: none; }
    
    .tinder-card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid var(--border); display: flex; flex-direction: column; }
    .tinder-card-front img { width: 100%; height: 100%; object-fit: cover; }
    .tinder-card-front .tinder-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 60px 15px 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); color: white; pointer-events: none;}
    .tinder-card-front h2 { font-size: 1.3rem; margin: 0; line-height: 1.2; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);}
    .tinder-card-front p { font-size: 0.9rem; color: #cbd5e1; margin-top: 4px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);}
    
    .tinder-card-back { transform: rotateY(180deg); padding: 20px; overflow-y: auto; background: var(--surface); color: var(--text); display: flex; flex-direction: column; pointer-events: auto;}
    .tinder-card-back h3 { margin-bottom: 10px; color: var(--primary); }
    .tinder-card-back .overview { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; }
    .tinder-card-back .rating { margin-top: auto; padding-top: 15px; font-weight: bold; color: var(--accent); }
    
    .tinder-flip-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(15,23,42,0.7); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 20; }
    
    .tinder-controls { display: flex; gap: 15px; margin-top: 30px; z-index: 10; flex-wrap: wrap; justify-content: center; }
    .tinder-btn-circle { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; cursor: pointer; border: 2px solid; background: var(--bg); transition: transform 0.1s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    @media (max-height: 700px) { .tinder-btn-circle { width: 48px; height: 48px; font-size: 1.3rem; } }
    .tinder-btn-circle:active { transform: scale(0.85); }
    .tinder-btn-skip { border-color: var(--danger); color: var(--danger); }
    .tinder-btn-super { border-color: var(--super); color: var(--super); }
    .tinder-btn-plan { border-color: #a855f7; color: #a855f7; }
    .tinder-btn-seen { border-color: var(--success); color: var(--success); }

    .tinder-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; color: var(--text-muted); }
    .swipe-indicator { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; font-weight: bold; opacity: 0; transition: opacity 0.2s; pointer-events: none; padding: 10px 20px; border-radius: 10px; border: 3px solid; z-index: 15; text-transform: uppercase; background: rgba(15,23,42,0.8); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🎬 Мій Кінокаталог</div>
    <div class="header-actions">
      <div class="sync-status" id="syncStatus">
        <span class="dot" id="syncDot"></span><span id="syncText">Локально</span>
      </div>
      <button onclick="syncFromGist()" title="Оновити з GitHub Gist">🔄</button>
      <button onclick="openSettings()">⚙️ Налаштування</button>
    </div>
  </div>
</header>

<div class="container" id="mainContainer">
  <!-- Пошук в TMDb -->
  <div class="search-box">
    <div class="search-title">
      <span>Додати переглянуте з бази TMDb</span>
      <button class="tinder-btn" onclick="openTinderMode()">🔥 Tinder-режим</button>
    </div>
    <form class="search-row" onsubmit="searchTMDb(event)">
      <input type="text" id="tmdbQuery" placeholder="Введіть назву фільму, серіалу чи документалки..." required />
      <button type="submit" class="primary">🔍 Знайти</button>
    </form>
    <div class="tmdb-results" id="tmdbResults"></div>
  </div>

  <!-- Фільтри та пошук у власному списку -->
  <div class="controls-bar">
    <div class="tabs" id="categoryTabs">
      <button class="tab active" data-cat="all" onclick="setCategory('all')">Переглянуті (<span id="cnt-all">0</span>)</button>
      <button class="tab" data-cat="movie" onclick="setCategory('movie')">Фільми</button>
      <button class="tab" data-cat="tv" onclick="setCategory('tv')">Серіали</button>
      <button class="tab" data-cat="doc" onclick="setCategory('doc')">Документальні</button>
      <button class="tab plan" data-cat="plan" onclick="setCategory('plan')">⬆️ Буду дивитись (<span id="cnt-plan">0</span>)</button>
    </div>

    <div class="filter-inputs">
      <button class="roulette-btn" id="btnRoulette" onclick="openRoulette()">🎲 Що подивитися?</button>
      <input type="text" id="localSearch" placeholder="Пошук..." oninput="renderCatalog()" style="max-width:150px;" />
      <select id="sortSelect" onchange="renderCatalog()" style="max-width: 160px;">
        <option value="added_desc">Новіші зверху</option>
        <option value="rating_desc">Вища оцінка</option>
        <option value="rating_asc">Нижча оцінка</option>
        <option value="year_desc">За роком</option>
        <option value="title_asc">За алфавітом</option>
      </select>
    </div>
  </div>

  <!-- Сітка каталогу -->
  <div class="catalog-grid" id="catalogGrid"></div>
</div>

<!-- TINDER РЕЖИМ OVERLAY -->
<div class="tinder-overlay" id="tinderOverlay">
  <div class="tinder-header">
    <div class="logo">🔥 Топ 500 популярних</div>
    <button onclick="closeTinderMode()">Закрити ❌</button>
  </div>
  
  <div class="tinder-area">
    <div class="tinder-loading" id="tinderLoading">
      <div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>
      <div>Завантаження карток з TMDb...</div>
    </div>
    <div class="swipe-indicator" id="swipeIndicator"></div>
    <div class="tinder-card-container" id="tinderContainer"></div>

    <div class="tinder-controls">
      <button class="tinder-btn-circle tinder-btn-skip" onclick="triggerSwipe('left')" title="Не бачив / Пропустити">❌</button>
      <button class="tinder-btn-circle tinder-btn-super" onclick="triggerSwipe('down')" title="Улюблене (10/10)">💖</button>
      <button class="tinder-btn-circle tinder-btn-plan" onclick="triggerSwipe('up')" title="Буду дивитись">⬆️</button>
      <button class="tinder-btn-circle tinder-btn-seen" onclick="triggerSwipe('right')" title="Вже бачив">✅</button>
    </div>
  </div>
</div>

<!-- Модальне вікно РУЛЕТКИ -->
<div class="modal-backdrop" id="rouletteModal">
  <div class="modal" style="text-align:center;">
    <div class="modal-handle"></div>
    <h3 style="color:var(--accent); font-size:1.4rem;">🎲 Рулетка на вечір</h3>
    <div id="rouletteDisplay">
      <div style="font-size:5rem; opacity:0.5;">🎰</div>
      <div style="color:var(--text-muted); margin-top:10px;">Натисніть "Крутити", щоб вибрати випадковий фільм</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
      <button class="primary" onclick="spinRoulette()" style="justify-content:center; padding:12px; font-size:1.1rem; background:linear-gradient(45deg, #8b5cf6, #d946ef); border:none;">Крутити барабан!</button>
      <button onclick="closeModal('rouletteModal')" style="justify-content:center;">Закрити</button>
    </div>
  </div>
</div>

<!-- Модальне вікно ДОДАВАННЯ/РЕДАГУВАННЯ -->
<div class="modal-backdrop" id="itemModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modalTitle">Оцінити запис</h3>
    <div style="display:flex; gap:12px; margin-bottom:14px; align-items:center;">
      <img id="modalPoster" src="" alt="" style="width:64px; height:96px; object-fit:cover; border-radius:6px; background:#090d16;" />
      <div>
        <div id="modalMovieName" style="font-weight:700; font-size:1rem;"></div>
        <div id="modalMovieYear" style="font-size:0.85rem; color:var(--text-muted);"></div>
      </div>
    </div>

    <div class="form-group">
      <label>Статус</label>
      <select id="itemStatus" onchange="toggleRatingVisibility()">
        <option value="watched">Переглянуто</option>
        <option value="plan">Буду дивитись</option>
      </select>
    </div>

    <div class="form-group">
      <label>Категорія</label>
      <select id="itemCategory">
        <option value="movie">Фільм</option>
        <option value="tv">Серіал</option>
        <option value="doc">Документальний</option>
      </select>
    </div>

    <div class="form-group" id="ratingGroup">
      <label>Ваша оцінка (1–10)</label>
      <div class="rating-selector" id="ratingSelector"></div>
      <div style="margin-top:8px;">
        <button type="button" onclick="setUnrated()" style="padding:4px 8px; font-size:0.75rem;">Залишити без оцінки</button>
      </div>
    </div>

    <div class="form-group">
      <label>Дата додавання/перегляду</label>
      <input type="date" id="itemDate" />
    </div>

    <div class="form-group">
      <label>Особиста нотатка (необов'язково)</label>
      <textarea id="itemNote" rows="3" placeholder="Наприклад: Чудовий дубляж..."></textarea>
    </div>

    <div class="modal-footer">
      <button onclick="closeModal('itemModal')">Скасувати</button>
      <button class="primary" onclick="saveItem()">💾 Зберегти</button>
    </div>
  </div>
</div>

<!-- Модальне вікно НАЛАШТУВАНЬ -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>⚙️ Налаштування та синхронізація</h3>
    <div class="form-group">
      <label>TMDb API Key (v3 auth)</label>
      <input type="password" id="cfgTmdbKey" placeholder="Вставте ключ API" />
    </div>
    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;" />
    <div class="form-group">
      <label>GitHub Token (права: gist)</label>
      <input type="password" id="cfgGhToken" placeholder="ghp_..." />
    </div>
    <div class="form-group">
      <label>GitHub Gist ID</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="cfgGistId" placeholder="ID (32 символи)" />
        <button type="button" onclick="createNewGist()">+ Створити</button>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('settingsModal')">Закрити</button>
      <button class="primary" onclick="saveSettings()">Зберегти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'my_cinema_catalog_v1';
  const CFG_KEY = 'my_cinema_cfg_v1';
  const GIST_FILENAME = 'my_watched_cinema.json';
  const NO_POSTER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" fill="%231e293b"><rect width="300" height="450"/><text x="50%" y="50%" fill="%2394a3b8" font-family="sans-serif" font-size="20" text-anchor="middle">Без постера</text></svg>';

  let catalog = [];
  let config = { tmdbKey: '', ghToken: '', gistId: '' };
  let currentCategory = 'all';
  let activeItem = null;
  let selectedRating = null; 

  let tinderQueue = [];
  let tinderPage = 1;
  let currentTinderItem = null;
  let startX, startY, currentX, currentY;
  let cardEl;
  let isRouletteSpinning = false;

  // Haptic feedback wrapper
  function vibe(pattern) {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch(e){}
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    loadConfig();
    loadLocalCatalog();
    buildRatingButtons();
    renderCatalog();

    if (config.ghToken && config.gistId) {
      await syncFromGist(true);
    } else if (!config.tmdbKey) {
      showToast('Вкажіть TMDb API Key у Налаштуваннях ⚙️');
    }
  });

  /* ================= CORE LOGIC ================= */
  function loadConfig() { try { const s = JSON.parse(localStorage.getItem(CFG_KEY)); if (s) config = { ...config, ...s }; } catch (e) {} }
  function loadLocalCatalog() { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (Array.isArray(s)) catalog = s; } catch (e) {} }
  function saveLocalCatalog() { localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog)); }

  function buildRatingButtons() {
    const wrap = document.getElementById('ratingSelector');
    wrap.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rate-btn' + (i === selectedRating ? ' selected' : '');
      btn.textContent = i;
      btn.onclick = () => {
        vibe(10); // Light tap on rating select
        selectedRating = i;
        document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
      wrap.appendChild(btn);
    }
  }

  function setUnrated() { selectedRating = null; document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('selected')); }
  function toggleRatingVisibility() { document.getElementById('ratingGroup').style.display = (document.getElementById('itemStatus').value === 'plan') ? 'none' : 'block'; }

  async function searchTMDb(e) {
    if(e) e.preventDefault();
    const query = document.getElementById('tmdbQuery').value.trim();
    if (!query) return;
    if (!config.tmdbKey) { openSettings(); return showToast('Введіть TMDb API Key'); }

    const resultsEl = document.getElementById('tmdbResults');
    resultsEl.innerHTML = '<div style="color:var(--text-muted);">Пошук...</div>';
    try {
      const url = `https://api.themoviedb.org/3/search/multi?api_key=${config.tmdbKey}&language=uk-UA&query=${encodeURIComponent(query)}&include_adult=false`;
      const res = await fetch(url);
      const data = await res.json();
      const items = (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv').slice(0, 8);
      
      if (!items.length) { resultsEl.innerHTML = '<div>Нічого не знайдено.</div>'; return; }
      resultsEl.innerHTML = '';
      
      items.forEach(item => {
        const isTv = item.media_type === 'tv';
        const isDoc = Array.isArray(item.genre_ids) && item.genre_ids.includes(99);
        const title = isTv ? item.name : item.title;
        const year = (isTv ? item.first_air_date : item.release_date)?.slice(0, 4) || '—';
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : NO_POSTER;
        const id = `${item.media_type}_${item.id}`;
        const existing = catalog.find(c => c.id === id);

        const div = document.createElement('div');
        div.className = 'tmdb-item';
        div.innerHTML = `
          <img src="${poster}" alt="" />
          <div class="tmdb-info">
            <h4 title="${escapeHtml(title)}">${escapeHtml(title)}</h4>
            <div class="tmdb-meta">${year} • ${isDoc?'Док.':isTv?'Серіал':'Фільм'}</div>
            <button class="${existing ? '' : 'primary'}" style="padding:5px 10px; font-size:0.8rem;">
              ${existing ? `✎ У списку` : '+ Додати'}
            </button>
          </div>
        `;
        div.querySelector('button').onclick = () => {
          vibe(10);
          openItemModal({
            id, tmdbId: item.id, title, year, poster,
            category: existing ? existing.category : (isDoc?'doc':isTv?'tv':'movie'),
            status: existing ? (existing.status||'watched') : 'watched',
            rating: existing ? existing.rating : null,
            watchedDate: existing ? existing.watchedDate : new Date().toISOString().slice(0, 10),
            note: existing ? existing.note : ''
          });
        };
        resultsEl.appendChild(div);
      });
    } catch (err) { resultsEl.innerHTML = `<div style="color:var(--danger);">${err.message}</div>`; }
  }

  function openItemModal(item) {
    activeItem = item;
    document.getElementById('modalTitle').textContent = catalog.some(c => c.id === item.id) ? 'Редагувати' : 'Додати у список';
    document.getElementById('modalPoster').src = item.poster || NO_POSTER;
    document.getElementById('modalMovieName').textContent = item.title;
    document.getElementById('modalMovieYear').textContent = item.year;
    document.getElementById('itemCategory').value = item.category;
    document.getElementById('itemStatus').value = item.status || 'watched';
    document.getElementById('itemDate').value = item.watchedDate || new Date().toISOString().slice(0, 10);
    document.getElementById('itemNote').value = item.note || '';

    selectedRating = item.rating;
    buildRatingButtons();
    toggleRatingVisibility();
    document.getElementById('itemModal').classList.add('open');
  }

  async function saveItem() {
    if (!activeItem) return;
    const status = document.getElementById('itemStatus').value;
    const entry = {
      ...activeItem,
      category: document.getElementById('itemCategory').value,
      status: status,
      rating: status === 'plan' ? null : selectedRating,
      watchedDate: document.getElementById('itemDate').value,
      note: document.getElementById('itemNote').value.trim(),
      updatedAt: Date.now()
    };

    const idx = catalog.findIndex(c => c.id === entry.id);
    if (idx >= 0) catalog[idx] = entry; else catalog.unshift(entry);

    saveLocalCatalog();
    closeModal('itemModal');
    document.getElementById('tmdbResults').innerHTML = '';
    document.getElementById('tmdbQuery').value = '';
    vibe([20, 30, 20]); // Success save haptic
    renderCatalog();
    showToast('Збережено!');
    backgroundGistSync();
  }

  async function deleteItem(id) {
    vibe([50, 50, 50]);
    if (!confirm('Видалити цей запис?')) return;
    catalog = catalog.filter(c => c.id !== id);
    saveLocalCatalog(); renderCatalog();
    backgroundGistSync();
  }

  function setCategory(cat) {
    vibe(10);
    currentCategory = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
    
    // Toggle Roulette button visibility
    const rBtn = document.getElementById('btnRoulette');
    if(cat === 'plan') { rBtn.style.display = 'inline-flex'; } else { rBtn.style.display = 'none'; }
    
    renderCatalog();
  }

  function renderCatalog() {
    const allWatched = catalog.filter(c => c.status !== 'plan');
    const plans = catalog.filter(c => c.status === 'plan');

    document.getElementById('cnt-all').textContent = allWatched.length;
    document.getElementById('cnt-plan').textContent = plans.length;

    const query = document.getElementById('localSearch').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;

    let list = catalog.filter(item => {
      const isPlanCat = currentCategory === 'plan';
      if (isPlanCat && item.status !== 'plan') return false;
      if (!isPlanCat && item.status === 'plan') return false;
      if (currentCategory !== 'all' && currentCategory !== 'plan' && item.category !== currentCategory) return false;
      if (query && !item.title.toLowerCase().includes(query) && !(item.note||'').toLowerCase().includes(query)) return false;
      return true;
    });

    list.sort((a, b) => {
      if (sort === 'rating_desc') return (b.rating||0) - (a.rating||0);
      if (sort === 'rating_asc') return (a.rating||0) - (b.rating||0);
      if (sort === 'year_desc') return (parseInt(b.year)||0) - (parseInt(a.year)||0);
      if (sort === 'title_asc') return a.title.localeCompare(b.title, 'uk');
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });

    const grid = document.getElementById('catalogGrid');
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">Нічого не знайдено.</div>`;
      return;
    }

    const catNames = { movie: 'Фільм', tv: 'Серіал', doc: 'Документальний' };
    grid.innerHTML = '';
    list.forEach(item => {
      const isSuper = item.rating === 10 && item.note && item.note.includes('Улюблене');
      const badge = item.status === 'plan' 
        ? `<span class="badge-plan">Планую</span>` 
        : `<span class="badge-rating ${isSuper ? 'super' : ''}">★ ${item.rating !== null ? item.rating : '—'}</span>`;

      grid.innerHTML += `
        <div class="card">
          <div class="poster-wrap">
            <img src="${item.poster || NO_POSTER}" alt="" loading="lazy" />
            <span class="badge-type">${catNames[item.category]}</span>
            ${badge}
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-year">${item.year}</div>
            ${item.note ? `<div class="card-note">${escapeHtml(item.note)}</div>` : ''}
            <div class="card-actions">
              <button onclick='editById("${item.id}")'>✏️</button>
              <button class="danger" onclick='deleteItem("${item.id}")'>🗑️</button>
            </div>
          </div>
        </div>`;
    });
  }

  function editById(id) { 
    vibe(10);
    const item = catalog.find(c => c.id === id); 
    if (item) openItemModal(item); 
  }

  /* ================= ROULETTE MODE ================= */
  function openRoulette() {
    const plans = catalog.filter(c => c.status === 'plan');
    if (plans.length < 2) return showToast('Додайте хоча б два фільми у "Буду дивитись"!');
    
    vibe(15);
    document.getElementById('rouletteModal').classList.add('open');
    document.getElementById('rouletteDisplay').innerHTML = `
      <div style="font-size:5rem; opacity:0.5;">🎰</div>
      <div style="color:var(--text-muted); margin-top:10px;">Натисніть "Крутити", щоб вибрати випадковий фільм</div>
    `;
    isRouletteSpinning = false;
  }

  function spinRoulette() {
    if (isRouletteSpinning) return;
    const plans = catalog.filter(c => c.status === 'plan');
    if(plans.length === 0) return;
    
    isRouletteSpinning = true;
    const display = document.getElementById('rouletteDisplay');
    
    // Slot machine logic
    let ticks = 0;
    const maxTicks = 20 + Math.floor(Math.random() * 15); // Random spin duration
    let delay = 30; // Start fast

    function tick() {
      const r = plans[Math.floor(Math.random() * plans.length)];
      display.innerHTML = `
        <img src="${r.poster||NO_POSTER}" class="r-poster"/>
        <div class="r-title">${escapeHtml(r.title)}</div>
      `;
      vibe(15); // Haptic tick per poster
      
      ticks++;
      if (ticks < maxTicks) {
        // Slow down formula
        delay += (ticks > maxTicks/2) ? 15 : 2; 
        setTimeout(tick, delay);
      } else {
        // Final winner
        vibe([100, 50, 200, 50, 100]); // Jackpot haptic
        display.innerHTML = `
          <div style="color:var(--accent); font-weight:bold; margin-bottom:10px; font-size:1.1rem; text-transform:uppercase;">🎉 Переможець! 🎉</div>
          <img src="${r.poster||NO_POSTER}" class="r-poster r-winner"/>
          <div class="r-title" style="color:var(--text); font-size:1.2rem;">${escapeHtml(r.title)}</div>
          <div style="margin-top:10px;">
             <button class="primary" style="padding:6px 12px; font-size:0.85rem;" onclick="editById('${r.id}'); closeModal('rouletteModal');">Відмітити як переглянуто</button>
          </div>
        `;
        isRouletteSpinning = false;
      }
    }
    tick();
  }

  /* ================= TINDER MODE ================= */
  async function openTinderMode() {
    if (!config.tmdbKey) { showToast('Введіть TMDb API Key для Tinder-режиму!'); return openSettings(); }
    vibe([20, 20, 20]);
    document.getElementById('tinderOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    if (tinderQueue.length < 5) await fetchTinderBatch();
    renderNextTinderCard();
  }

  function closeTinderMode() {
    document.getElementById('tinderOverlay').style.display = 'none';
    document.body.style.overflow = '';
    renderCatalog();
  }

  async function fetchTinderBatch() {
    document.getElementById('tinderLoading').style.display = 'flex';
    try {
      for(let i=0; i<2; i++) {
        const url = `https://api.themoviedb.org/3/discover/movie?api_key=${config.tmdbKey}&language=uk-UA&sort_by=popularity.desc&vote_count.gte=1000&page=${tinderPage}`;
        const res = await fetch(url);
        const data = await res.json();
        
        (data.results || []).forEach(item => {
          const id = `movie_${item.id}`;
          if (!catalog.some(c => c.id === id) && !tinderQueue.some(q => q.id === id)) tinderQueue.push(item);
        });
        tinderPage++;
        if(tinderPage > 25) tinderPage = 1;
      }
    } catch(err) { console.error(err); }
    document.getElementById('tinderLoading').style.display = 'none';
  }

  function renderNextTinderCard() {
    const container = document.getElementById('tinderContainer');
    container.innerHTML = '';
    
    if (tinderQueue.length === 0) {
      container.innerHTML = '<div style="color:white; text-align:center;">Шукаю ще фільми...</div>';
      fetchTinderBatch().then(renderNextTinderCard);
      return;
    }

    currentTinderItem = tinderQueue.shift();
    if (tinderQueue.length < 5) fetchTinderBatch();

    const item = currentTinderItem;
    const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : NO_POSTER;
    const year = (item.release_date || '').slice(0,4);

    cardEl = document.createElement('div');
    cardEl.className = 'tinder-card';
    
    cardEl.innerHTML = `
      <div class="tinder-card-face tinder-card-front">
        <img src="${poster}" alt="" draggable="false"/>
        <div class="tinder-flip-btn" onclick="flipTinderCard(event)" title="Прочитати сюжет">ℹ️</div>
        <div class="tinder-info">
          <h2>${escapeHtml(item.title)}</h2>
          <p>${year} • ★ ${item.vote_average?.toFixed(1)}</p>
        </div>
      </div>
      <div class="tinder-card-face tinder-card-back">
        <div class="tinder-flip-btn" onclick="flipTinderCard(event)">🔙</div>
        <h3>${escapeHtml(item.title)}</h3>
        <p class="overview">${escapeHtml(item.overview) || 'Опис українською відсутній.'}</p>
        <div class="rating">Оцінка TMDb: ${item.vote_average?.toFixed(1)}</div>
      </div>
    `;

    container.appendChild(cardEl);
    initSwipe(cardEl);
  }

  function flipTinderCard(e) { 
    e.stopPropagation(); 
    if(cardEl) {
      vibe(15);
      cardEl.classList.toggle('flipped'); 
    }
  }

  function initSwipe(el) {
    let isDown = false;
    let thresholdHit = false; // Prevents buzzing continuously when holding past threshold
    
    const handleStart = (e) => {
      if (e.target.closest('.tinder-flip-btn') || el.classList.contains('flipped')) return;
      isDown = true;
      thresholdHit = false;
      el.classList.add('moving');
      startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    };
    
    const handleMove = (e) => {
      if (!isDown) return;
      currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      
      const dx = currentX - startX;
      const dy = currentY - startY;
      const rotate = dx * 0.05;
      
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rotate}deg)`;
      
      const ind = document.getElementById('swipeIndicator');
      let currentThreshold = false;

      if (dx > 100) { ind.textContent = '✅ Вже бачив'; ind.style.borderColor = 'var(--success)'; ind.style.color = 'var(--success)'; ind.style.opacity = 1; currentThreshold = true; }
      else if (dx < -100) { ind.textContent = '❌ Не бачив'; ind.style.borderColor = 'var(--danger)'; ind.style.color = 'var(--danger)'; ind.style.opacity = 1; currentThreshold = true; }
      else if (dy > 100 && Math.abs(dx) < 60) { ind.textContent = '💖 Улюблене (10/10)'; ind.style.borderColor = 'var(--super)'; ind.style.color = 'var(--super)'; ind.style.opacity = 1; currentThreshold = true; }
      else if (dy < -100 && Math.abs(dx) < 60) { ind.textContent = '⬆️ Буду дивитись'; ind.style.borderColor = '#a855f7'; ind.style.color = '#a855f7'; ind.style.opacity = 1; currentThreshold = true; }
      else { ind.style.opacity = 0; currentThreshold = false; }

      // Haptic feedback when crossing the trigger threshold
      if (currentThreshold && !thresholdHit) { vibe(20); thresholdHit = true; }
      else if (!currentThreshold && thresholdHit) { thresholdHit = false; }
    };

    const handleEnd = () => {
      if (!isDown) return;
      isDown = false;
      el.classList.remove('moving');
      document.getElementById('swipeIndicator').style.opacity = 0;
      
      const dx = currentX - startX;
      const dy = currentY - startY;
      
      if (dx > 120) { triggerSwipe('right'); }
      else if (dx < -120) { triggerSwipe('left'); }
      else if (dy > 120 && Math.abs(dx) < 80) { triggerSwipe('down'); }
      else if (dy < -120 && Math.abs(dx) < 80) { triggerSwipe('up'); }
      else { el.style.transform = ''; } // Snap back if threshold not met
      
      currentX = startX; currentY = startY;
    };

    el.addEventListener('mousedown', handleStart);
    el.addEventListener('touchstart', handleStart, {passive: true});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: true});
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);
  }

  function triggerSwipe(direction) {
    if(!cardEl || !currentTinderItem) return;
    
    const x = direction === 'right' ? window.innerWidth : (direction === 'left' ? -window.innerWidth : 0);
    const y = direction === 'up' ? -window.innerHeight : (direction === 'down' ? window.innerHeight : 0);
    
    cardEl.style.transition = 'transform 0.4s ease-out';
    cardEl.style.transform = `translate(${x}px, ${y}px) rotate(${x * 0.05}deg)`;
    
    // Final action haptic
    if(direction === 'right') vibe(40);
    else if(direction === 'left') vibe([10, 30, 10]);
    else if(direction === 'up') vibe(30);
    else if(direction === 'down') vibe([50, 50, 100]); // Heavy superlike vibe

    if (direction === 'right' || direction === 'up' || direction === 'down') {
      const isPlan = direction === 'up';
      const isSuper = direction === 'down';
      const item = currentTinderItem;
      const newEntry = {
        id: `movie_${item.id}`,
        tmdbId: item.id,
        title: item.title,
        year: (item.release_date || '').slice(0,4),
        poster: item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : '',
        category: 'movie',
        status: isPlan ? 'plan' : 'watched',
        rating: isSuper ? 10 : null,
        watchedDate: new Date().toISOString().slice(0, 10),
        note: isSuper ? '💖 Улюблене' : '',
        updatedAt: Date.now()
      };
      
      if(!catalog.some(c => c.id === newEntry.id)){
        catalog.unshift(newEntry);
        saveLocalCatalog();
        backgroundGistSync();
      }
    }

    setTimeout(() => renderNextTinderCard(), 300);
  }

  /* ================= GITHUB GIST SYNC ================= */
  function setSyncState(state, text) { document.getElementById('syncDot').className = 'dot ' + state; document.getElementById('syncText').textContent = text; }

  async function createNewGist() {
    vibe(10);
    const t = document.getElementById('cfgGhToken').value.trim();
    if(!t) return showToast('Введіть GitHub Token');
    try {
      const res = await fetch('https://api.github.com/gists', { method: 'POST', headers: { 'Authorization': `Bearer ${t}`, 'Accept': 'application/vnd.github+json' }, body: JSON.stringify({ public: false, files: { [GIST_FILENAME]: { content: JSON.stringify(catalog, null, 2) } } }) });
      if(!res.ok) throw new Error('Помилка Gist');
      const data = await res.json();
      document.getElementById('cfgGistId').value = data.id;
      showToast('Gist створено!');
    } catch(e) { showToast(e.message); }
  }

  let syncTimeout;
  function backgroundGistSync() {
    if (!config.ghToken || !config.gistId) return;
    clearTimeout(syncTimeout);
    setSyncState('loading', 'Очікування...');
    syncTimeout = setTimeout(pushToGist, 2000);
  }

  async function pushToGist() {
    if (!config.ghToken || !config.gistId) return;
    setSyncState('loading', 'Збереження...');
    try {
      await fetch(`https://api.github.com/gists/${config.gistId}`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${config.ghToken}`, 'Accept': 'application/vnd.github+json' }, body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(catalog, null, 2) } } }) });
      setSyncState('ok', 'Синхронізовано');
    } catch (e) { setSyncState('err', 'Помилка'); }
  }

  async function syncFromGist(silent = false) {
    if (!config.ghToken || !config.gistId) return;
    setSyncState('loading', 'Оновлення...');
    try {
      const res = await fetch(`https://api.github.com/gists/${config.gistId}?t=${Date.now()}`, { headers: { 'Authorization': `Bearer ${config.ghToken}` }});
      const data = await res.json();
      const content = data.files[GIST_FILENAME]?.content;
      if (content) { catalog = JSON.parse(content); saveLocalCatalog(); renderCatalog(); }
      setSyncState('ok', 'Синхронізовано');
      if(!silent) showToast('Дані оновлено');
    } catch (e) { setSyncState('err', 'Помилка'); }
  }

  /* ================= UTILS ================= */
  function openSettings() { 
    vibe(10);
    document.getElementById('cfgTmdbKey').value = config.tmdbKey || ''; document.getElementById('cfgGhToken').value = config.ghToken || ''; document.getElementById('cfgGistId').value = config.gistId || ''; document.getElementById('settingsModal').classList.add('open'); 
  }
  function saveSettings() { 
    vibe([20, 20]);
    config.tmdbKey = document.getElementById('cfgTmdbKey').value.trim(); config.ghToken = document.getElementById('cfgGhToken').value.trim(); config.gistId = document.getElementById('cfgGistId').value.trim(); localStorage.setItem(CFG_KEY, JSON.stringify(config)); closeModal('settingsModal'); showToast('Збережено'); if (config.ghToken && config.gistId) syncFromGist(); 
  }
  function closeModal(id) { 
    vibe(10);
    document.getElementById(id).classList.remove('open'); 
  }
  
  // Close modal when tapping on the backdrop (mobile UX)
  document.querySelectorAll('.modal-backdrop').forEach(bd => {
    bd.addEventListener('click', (e) => {
      if(e.target === bd) { closeModal(bd.id); }
    });
  });

  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  let tTimer; function showToast(m) { const e = document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(()=>e.classList.remove('show'),3000); }
</script>
</body>
</html>
